<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volo Discover - A/B Test Selection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">

  <div class="bg-white p-10 rounded-3xl shadow-xl max-w-lg w-full text-center border border-slate-200">
    <h1 class="text-3xl font-extrabold text-[#013AF5] mb-2 uppercase italic tracking-tighter">VOLO DISCOVER</h1>
    <p class="text-gray-500 mb-8 font-medium">Select a version to test</p>

    <div class="space-y-4">
      <a href="variant_a.html"
        class="block w-full py-4 px-6 rounded-xl border border-slate-200 hover:border-[#013AF5] hover:bg-blue-50 transition group text-left">
        <div class="flex items-center justify-between">
          <div>
            <span class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Control</span>
            <h2 class="text-xl font-bold text-gray-900 group-hover:text-[#013AF5]">Test A</h2>
          </div>
          <div
            class="h-10 w-10 rounded-full bg-slate-100 flex items-center justify-center group-hover:bg-[#013AF5] group-hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </div>
        </div>
      </a>

      <a href="variant_b.html"
        class="block w-full py-4 px-6 rounded-xl border border-slate-200 hover:border-[#c7ff10] hover:bg-[#faffd8] transition group text-left">
        <div class="flex items-center justify-between">
          <div>
            <span class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Variant</span>
            <h2 class="text-xl font-bold text-gray-900">Test B</h2>
          </div>
          <div
            class="h-10 w-10 rounded-full bg-slate-100 flex items-center justify-center group-hover:bg-[#c7ff10] group-hover:text-black transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </div>
        </div>
      </a>
    </div>

    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-xs text-gray-400">Legacy Build • v1.0.1</p>
    </div>
  </div>

</body>

</html>
